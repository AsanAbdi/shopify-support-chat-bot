stages: [test, build]

variables:
  DOCKER_BUILDKIT: "1"
  POSTGRES_PASSWORD: ci

test:
  stage: test
  image: docker:27
  services: ["docker:27-dind"]
  script:
    - docker compose -f docker-compose.yml --profile test run --rm --build tests
  after_script:
    - docker compose -f docker-compose.yml down -v

build:
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --target prod -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/backend:latest" backend
    - docker push --all-tags "$CI_REGISTRY_IMAGE/backend"

# Manual rollout to the EC2 host through SSM (no SSH). Needs CI variables AWS_REGION, AWS_INSTANCE_ID and AWS credentials
# (prefer GitLab OIDC with an IAM role limited to ssm:SendCommand on that instance).
deploy:aws:
  stage: build
  image:
    name: amazon/aws-cli:2
    entrypoint: [""]
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - |
      cmd_id=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" \
        --document-name AWS-RunShellScript --parameters 'commands=["/usr/local/bin/shop-support-deploy"]' \
        --query Command.CommandId --output text)
    - aws ssm wait command-executed --region "$AWS_REGION" --command-id "$cmd_id" --instance-id "$AWS_INSTANCE_ID"
    - aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$cmd_id" --instance-id "$AWS_INSTANCE_ID" --query StandardOutputContent --output text
