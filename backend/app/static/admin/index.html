<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Support assistant admin</title>
<style>
  /* ---------- tokens (light, dark by system preference, manual override via data-theme) ---------- */
  :root {
    --bg:#f3f6f4; --surface:#fff; --surface-2:#f7f9f8; --line:#e2e8e4; --line-strong:#cbd5cf;
    --text:#15201b; --muted:#5d6d65; --faint:#8a9a92;
    --brand:#0e7a58; --brand-600:#0a6247; --brand-soft:#e1f3ec; --on-brand:#fff;
    --ok:#10734a; --ok-soft:#dcf2e6; --warn:#8f5f00; --warn-soft:#fff2cf; --bad:#b3261e; --bad-soft:#fde6e3; --info:#1b5ea6; --info-soft:#e2eefb;
    --shadow:0 1px 2px rgba(15,32,26,.06), 0 6px 20px rgba(15,32,26,.05); --radius:12px; --radius-sm:8px;
    --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d1411; --surface:#141d19; --surface-2:#19251f; --line:#25332c; --line-strong:#364a40;
      --text:#e6efeb; --muted:#9db0a7; --faint:#6f8479;
      --brand:#36b78c; --brand-600:#2c9a75; --brand-soft:#153026; --on-brand:#06110c;
      --ok:#5fd19b; --ok-soft:#133120; --warn:#e8bb4d; --warn-soft:#352b0d; --bad:#ff8c82; --bad-soft:#3b1a17; --info:#7eb5f2; --info-soft:#132a40;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d1411; --surface:#141d19; --surface-2:#19251f; --line:#25332c; --line-strong:#364a40;
    --text:#e6efeb; --muted:#9db0a7; --faint:#6f8479;
    --brand:#36b78c; --brand-600:#2c9a75; --brand-soft:#153026; --on-brand:#06110c;
    --ok:#5fd19b; --ok-soft:#133120; --warn:#e8bb4d; --warn-soft:#352b0d; --bad:#ff8c82; --bad-soft:#3b1a17; --info:#7eb5f2; --info-soft:#132a40;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
  }

  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; font:14px/1.5 var(--font); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased }
  h1,h2,h3,p { margin:0 } button { font:inherit; color:inherit } a { color:var(--brand) }
  .hidden { display:none !important } .muted { color:var(--muted) } .faint { color:var(--faint) } .pre { white-space:pre-wrap }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; border-radius:6px }
  svg.i { flex:none; vertical-align:middle }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important } }

  /* ---------- buttons, inputs ---------- */
  .btn { display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--radius-sm); cursor:pointer; font-weight:500; transition:background .12s, border-color .12s, transform .05s; white-space:nowrap }
  .btn:hover { background:var(--surface-2); border-color:var(--faint) } .btn:active { transform:translateY(1px) }
  .btn[disabled] { opacity:.55; cursor:not-allowed }
  .btn.pri { background:var(--brand); border-color:var(--brand); color:var(--on-brand) } .btn.pri:hover { background:var(--brand-600); border-color:var(--brand-600) }
  .btn.ghost { border-color:transparent; background:transparent } .btn.ghost:hover { background:var(--surface-2) }
  .btn.danger { color:var(--bad); border-color:color-mix(in srgb, var(--bad) 35%, var(--line)) } .btn.danger:hover { background:var(--bad-soft) }
  .btn.danger-solid { background:var(--bad); border-color:var(--bad); color:#fff }
  .btn.sm { padding:4px 9px; font-size:13px } .btn.icon { padding:7px; justify-content:center }
  input, select { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:8px 11px; min-width:0 }
  input::placeholder { color:var(--faint) } input:focus, select:focus { outline:2px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset:0; border-color:var(--brand) }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px } .field > span { font-size:12px; font-weight:600; color:var(--muted) }
  .search { position:relative; flex:1; min-width:180px } .search input { width:100%; padding-left:34px } .search .i { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint) }
  .search .clear { position:absolute; right:4px; top:50%; transform:translateY(-50%) }

  /* ---------- shell ---------- */
  .shell { display:grid; grid-template-columns:240px 1fr; min-height:100vh }
  .side { background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 14px; gap:18px; position:sticky; top:0; height:100vh }
  .brand { display:flex; align-items:center; gap:11px; padding:2px 8px } .brand b { display:block; line-height:1.15 } .brand small { color:var(--muted) }
  .logo { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, var(--brand), var(--brand-600)); color:var(--on-brand); display:grid; place-items:center }
  #nav { display:flex; flex-direction:column; gap:3px }
  .navlink { display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:var(--radius-sm); color:var(--muted); text-decoration:none; font-weight:500; border:0; background:none; cursor:pointer; text-align:left }
  .navlink:hover { background:var(--surface-2); color:var(--text) } .navlink.on { background:var(--brand-soft); color:var(--brand) }
  .side-foot { margin-top:auto; display:flex; flex-direction:column; gap:10px }
  .me { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface-2) } .me b { display:block; line-height:1.2 } .me small { color:var(--muted) }
  .foot-actions { display:flex; gap:6px } .foot-actions .btn { flex:1; justify-content:center }
  .avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; color:#fff; letter-spacing:.02em }
  .main { min-width:0; display:flex; flex-direction:column }
  .topbar { display:flex; align-items:center; gap:14px; padding:18px 26px 6px } .topbar h1 { font-size:22px; letter-spacing:-.01em; flex:1 }
  .view { padding:14px 26px 30px; flex:1; min-height:0 }
  @media (max-width: 900px) {
    .shell { grid-template-columns:1fr } .side { position:static; height:auto; flex-direction:row; align-items:center; flex-wrap:wrap; padding:10px 12px; gap:8px }
    #nav { flex-direction:row; overflow-x:auto; order:3; width:100% } .navlink span { white-space:nowrap } .side-foot { margin:0 0 0 auto; flex-direction:row } .me { display:none }
    .topbar, .view { padding-left:14px; padding-right:14px }
  }

  /* ---------- cards, badges ---------- */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow) }
  .card + .card, .stack > * + * { margin-top:16px } .card h2 { font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:8px } .card h2 small { font-weight:400; color:var(--muted) }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); white-space:nowrap }
  .badge.ok { background:var(--ok-soft); color:var(--ok); border-color:transparent } .badge.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent }
  .badge.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent } .badge.info { background:var(--info-soft); color:var(--info); border-color:transparent }
  .spin { width:11px; height:11px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:rot .7s linear infinite } @keyframes rot { to { transform:rotate(360deg) } }
  table { width:100%; border-collapse:collapse } th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; background:var(--surface-2); position:sticky; top:0 } tbody tr:hover { background:var(--surface-2) } tbody tr:last-child td { border-bottom:0 }
  .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:var(--radius-sm); max-height:calc(100vh - 330px) } .num { font-variant-numeric:tabular-nums }
  .empty { display:grid; place-items:center; text-align:center; gap:8px; padding:40px 20px; color:var(--muted) } .empty .i { color:var(--faint) } .empty b { color:var(--text) }
  .skeleton { background:linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size:200% 100%; animation:sh 1.2s linear infinite; border-radius:8px; min-height:14px } @keyframes sh { to { background-position:-200% 0 } }

  /* ---------- statistics ---------- */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:14px } .kpis .card + .card { margin-top:0 }
  .kpi { display:flex; gap:14px; align-items:flex-start } .kpi .ico { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; background:var(--brand-soft); color:var(--brand); flex:none }
  .kpi b { display:block; font-size:26px; line-height:1.1; letter-spacing:-.02em; font-variant-numeric:tabular-nums } .kpi span { color:var(--muted); font-size:13px } .kpi small { display:block; margin-top:4px; color:var(--faint) }
  .grid2 { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-top:16px } .grid2 > .card { margin:0 } @media (max-width:1100px) { .grid2 { grid-template-columns:1fr } }
  .chart { display:flex; align-items:flex-end; gap:3px; height:150px; padding-top:8px; border-bottom:1px solid var(--line) } .chart i { flex:1; min-width:2px; background:var(--brand); border-radius:3px 3px 0 0; opacity:.9; transition:opacity .1s } .chart i:hover { opacity:1; filter:brightness(1.12) } .chart i.zero { background:var(--line); height:2px !important }
  .axis { display:flex; justify-content:space-between; color:var(--faint); font-size:12px; margin-top:6px }
  .meter { height:10px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden } .meter > i { display:block; height:100%; background:var(--brand); border-radius:99px } .meter.warn > i { background:#d99a00 } .meter.bad > i { background:var(--bad) }
  .seg { display:inline-flex; border:1px solid var(--line-strong); border-radius:var(--radius-sm); overflow:hidden; background:var(--surface) } .seg button { border:0; background:none; padding:6px 12px; cursor:pointer; color:var(--muted); font-weight:500 } .seg button.on { background:var(--brand-soft); color:var(--brand) }
  .hbar { display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line) } .hbar:last-child { border-bottom:0 } .hbar .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .hbar .b { grid-column:1 / -1; height:4px; border-radius:99px; background:var(--surface-2) } .hbar .b i { display:block; height:100%; background:var(--warn); border-radius:99px; opacity:.7 }

  /* ---------- conversations: list + detail side by side ---------- */
  .split { display:grid; grid-template-columns:minmax(310px, 400px) 1fr; gap:16px; height:calc(100vh - 140px); min-height:420px }
  .pane { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); display:flex; flex-direction:column; min-height:0; overflow:hidden }
  .toolbar { padding:12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px }
  .pills { display:flex; gap:6px; flex-wrap:wrap } .pill { border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:3px 11px; cursor:pointer; font-size:13px; color:var(--muted); font-weight:500; display:inline-flex; gap:6px; align-items:center }
  .pill:hover { border-color:var(--faint) } .pill.on { background:var(--brand-soft); color:var(--brand); border-color:transparent } .pill em { font-style:normal; font-variant-numeric:tabular-nums; opacity:.75; font-size:12px }
  .list { overflow:auto; flex:1; outline:none } .conv { display:flex; gap:11px; width:100%; text-align:left; padding:12px 14px; border:0; border-bottom:1px solid var(--line); background:none; cursor:pointer; align-items:flex-start }
  .conv:hover { background:var(--surface-2) } .conv.on { background:var(--brand-soft); box-shadow:inset 3px 0 var(--brand) }
  .conv-main { min-width:0; flex:1 } .conv-top { display:flex; gap:8px; align-items:baseline; justify-content:space-between } .conv-who { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .conv-top time { color:var(--faint); font-size:12px; white-space:nowrap }
  .conv-preview { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin:1px 0 6px } .conv-tags { display:flex; gap:5px; flex-wrap:wrap }
  .detail { display:flex; flex-direction:column; min-height:0; flex:1 } .detail-head { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px }
  .detail-title { display:flex; align-items:center; gap:12px } .detail-title h2 { font-size:17px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .meta { display:flex; gap:6px 14px; flex-wrap:wrap; color:var(--muted); font-size:13px } .meta span { display:inline-flex; gap:5px; align-items:center }
  .thread { overflow-y:auto; overflow-x:hidden; padding:16px 18px 22px; flex:1; background:var(--bg); display:flex; flex-direction:column; gap:10px }
  .note { border:1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); background:var(--warn-soft); color:var(--text); border-radius:var(--radius-sm); padding:12px 14px } .note h3 { font-size:13px; display:flex; gap:7px; align-items:center; color:var(--warn); margin-bottom:6px } .note p { white-space:pre-wrap; overflow-wrap:anywhere } .note { flex:none; min-width:0 }
  .day { align-self:center; font-size:12px; color:var(--faint); background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:1px 12px; margin:4px 0 }
  .bubble { max-width:min(78%, 640px); display:flex; flex-direction:column; gap:3px } .bubble.user { align-self:flex-end; align-items:flex-end } .bubble.assistant { align-self:flex-start }
  .bubble .who { font-size:12px; color:var(--faint); display:flex; gap:8px; align-items:center } .bubble .body { padding:9px 13px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; border:1px solid var(--line) }
  .bubble.user .body { background:var(--brand); color:var(--on-brand); border-color:transparent; border-bottom-right-radius:4px } .bubble.user .body a { color:inherit }
  .bubble.assistant .body { background:var(--surface); border-bottom-left-radius:4px } .cite { background:var(--brand-soft); color:var(--brand); border-radius:6px; padding:0 4px; font-size:11px; font-weight:700; margin:0 1px }
  .sources { display:flex; gap:6px; flex-wrap:wrap } .sources a, .sources span { font-size:12px; text-decoration:none; border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:1px 9px; color:var(--muted) }
  .back { display:none }
  @media (max-width: 900px) {
    .split { grid-template-columns:1fr; height:calc(100vh - 190px) } .split.has-detail .list-pane { display:none } .split:not(.has-detail) .detail-pane { display:none } .back { display:inline-flex }
    .bubble { max-width:90% }
  }

  /* ---------- documents ---------- */
  .drop { border:2px dashed var(--line-strong); border-radius:var(--radius); padding:22px; text-align:center; color:var(--muted); transition:border-color .12s, background .12s; cursor:pointer } .drop:hover, .drop.over { border-color:var(--brand); background:var(--brand-soft); color:var(--brand) } .drop b { color:var(--text) }
  .filetype { display:inline-grid; place-items:center; width:34px; height:34px; border-radius:8px; background:var(--surface-2); color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.03em; border:1px solid var(--line) }
  .doc-title { font-weight:600 } .doc-src { color:var(--muted); font-size:12px; max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

  /* ---------- login, toasts, dialog ---------- */
  .login { min-height:100vh; display:grid; place-items:center; padding:20px; background:radial-gradient(900px 500px at 20% 0%, var(--brand-soft), transparent), var(--bg) }
  .login .card { width:100%; max-width:380px; padding:28px } .login .brand { padding:0; margin-bottom:20px } .login .field { margin-bottom:14px }
  .err { color:var(--bad); min-height:20px; margin-top:10px }
  #toasts { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; max-width:min(420px, calc(100vw - 36px)) }
  .toast { display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--line-strong); border-left:4px solid var(--ok); border-radius:var(--radius-sm); padding:10px 14px; box-shadow:0 8px 28px rgba(0,0,0,.18); animation:in .18s ease-out } .toast.err { border-left-color:var(--bad) } .toast.out { opacity:0; transform:translateY(6px); transition:.22s } .toast .i { margin-top:2px; color:var(--ok) } .toast.err .i { color:var(--bad) }
  @keyframes in { from { opacity:0; transform:translateY(8px) } }
  dialog { border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--surface); color:var(--text); padding:0; width:min(440px, calc(100vw - 28px)); box-shadow:0 24px 70px rgba(0,0,0,.35) } dialog::backdrop { background:rgba(8,14,11,.55); backdrop-filter:blur(2px) }
  .dlg-body { padding:22px } .dlg-body h3 { font-size:17px; margin-bottom:8px } .dlg-body > p { margin-bottom:14px } .dlg-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <form class="card" id="login-form">
    <div class="brand"><div class="logo" id="login-logo"></div><div><b>Support assistant</b><small>Admin sign-in</small></div></div>
    <label class="field"><span>Username</span><input id="u" autocomplete="username" required autofocus></label>
    <label class="field"><span>Password</span><input id="p" type="password" autocomplete="current-password" required></label>
    <button class="btn pri" type="submit" style="width:100%; justify-content:center" id="go">Sign in</button>
    <p class="err" id="lerr" role="alert"></p>
  </form>
</div>

<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand"><div class="logo" id="app-logo"></div><div><b>Support assistant</b><small>Admin</small></div></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <div class="me"><div class="avatar" id="me-avatar"></div><div><b id="me-name"></b><small id="me-role"></small></div></div>
      <div class="foot-actions" id="foot-actions"></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="title"></h1><div class="row" id="actions"></div></header>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };
const state = { token: sessionStorage.getItem("tok"), role: sessionStorage.getItem("role"), user: sessionStorage.getItem("user"), cleanup: null, tab: null, conv: null };

/* ---------------- DOM helpers (every dynamic string goes through textContent) ---------------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
// Native replaceChildren() stringifies arrays ("[object HTMLDivElement],...") and null ("null"); this one flattens and skips empties.
function setChildren(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false)); }

const ICONS = {
  stats: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/>',
  chat: '<path d="M21 12c0 4.4-4 8-9 8-1.3 0-2.6-.2-3.7-.7L3 20l1.4-4.2C3.5 14.5 3 13.3 3 12c0-4.4 4-8 9-8s9 3.6 9 8z"/>',
  book: '<path d="M5 4h13a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1z"/><path d="M8 4v16"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17 14.2c2.4.2 4.3 2.2 4.3 4.8"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',

/* ---------------- knowledge base ---------------- */
async function viewDocuments() {
  const isAdmin = state.role === "admin"; let docs = [], timer = null, q = "", status = "all";
  const typeOf = (d) => d.source_type === "url" ? "URL" : (d.source.split(".").pop() || "").slice(0, 4).toUpperCase();
  const table = h("div", {}); const summary = h("span", { class: "muted" });
  const fileInput = h("input", { type: "file", multiple: true, class: "hidden", accept: ".pdf,.docx,.md,.markdown,.txt,.csv,.html,.htm" });
  const upload = async (files) => { for (const f of files) { const fd = new FormData(); fd.append("file", f); await run(null, () => api("/admin/documents", { method: "POST", body: fd }), `Uploaded ${f.name}`); } await load(); };
  const urlInput = h("input", { type: "url", placeholder: "https://help.example.com/article", style: "flex:1;min-width:220px" });
  const drop = h("div", { class: "drop", tabindex: "0", role: "button", onclick: () => fileInput.click(), onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") fileInput.click(); },
    ondragover: (e) => { e.preventDefault(); drop.classList.add("over"); }, ondragleave: () => drop.classList.remove("over"), ondrop: (e) => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files]); } },
    icon("upload", 26), h("div", {}, h("b", {}, "Drop files here"), " or click to choose"), h("small", {}, "PDF, DOCX, Markdown, CSV, HTML. A file with the same name replaces the old one; only changed passages are re-indexed."));
  fileInput.addEventListener("change", () => { upload([...fileInput.files]); fileInput.value = ""; });
  const addUrl = () => urlInput.value.trim() && run(null, () => api("/admin/documents/url", { method: "POST", body: { url: urlInput.value.trim() } }), "Page added").then((ok) => { if (ok) { urlInput.value = ""; load(); } });
  urlInput.addEventListener("keydown", (e) => e.key === "Enter" && addUrl());
  const reindexAll = async (e) => {
    if (!(await confirmDialog("Re-embed everything?", "Every document and the product catalog are re-processed in the background. It runs on this machine, costs no LLM calls and takes a few minutes.", { ok: "Reindex all" }))) return;
    if (await run(e.currentTarget, () => api("/admin/reindex-all", { method: "POST" }), "Reindexing started")) load();
  };
  const filters = h("div", { class: "row", style: "margin-bottom:12px" },
    h("div", { class: "search" }, icon("search", 16), h("input", { type: "search", placeholder: "Filter by title or source…", "aria-label": "Filter documents", oninput: (e) => { q = e.target.value.toLowerCase(); draw(); } })),
    h("select", { "aria-label": "Status", onchange: (e) => { status = e.target.value; draw(); } }, ["all", "indexed", "pending", "indexing", "failed"].map((s) => h("option", { value: s }, s === "all" ? "All statuses" : s))), summary);
  setChildren($("#view"),
    isAdmin ? h("div", { class: "card" }, drop, fileInput, h("div", { class: "row", style: "margin-top:14px" }, icon("link", 18), urlInput, btn("Add page", "plus", { class: "pri", onclick: addUrl }), h("span", { style: "flex:1" }), btn("Reindex all", "refresh", { title: "Re-embed every document and the product catalog (no LLM cost)", onclick: reindexAll }))) : null,
    h("div", { class: "card" }, filters, table));
  const badge = (d) => h("span", { class: "badge " + (d.status === "indexed" ? "ok" : d.status === "failed" ? "bad" : "warn") }, d.status === "pending" || d.status === "indexing" ? h("span", { class: "spin" }) : null, d.status);
  function draw() {
    const rows = docs.filter((d) => (status === "all" || d.status === status) && (!q || (d.title + " " + d.source).toLowerCase().includes(q)));
    const chunks = docs.reduce((a, d) => a + d.chunks, 0); summary.textContent = `${rows.length} of ${docs.length} documents · ${chunks} passages`;
    setChildren(table, rows.length ? h("div", { class: "table-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["", "Document", "Status", "Passages", "Indexed", ""].map((t) => h("th", {}, t)))),
      h("tbody", {}, rows.map((d) => h("tr", {}, h("td", { style: "width:52px" }, h("span", { class: "filetype" }, typeOf(d))),
        h("td", {}, h("div", { class: "doc-title" }, d.title), h("div", { class: "doc-src", title: d.source }, d.source)),
        h("td", {}, badge(d), d.error ? h("div", { class: "err", style: "margin:4px 0 0;min-height:0;max-width:300px", title: d.error }, d.error.slice(0, 110)) : null),
        h("td", { class: "num" }, d.chunks), h("td", { class: "muted", title: fmt(d.indexed_at) }, d.indexed_at ? ago(d.indexed_at) : "–"),
        h("td", { style: "text-align:right;white-space:nowrap" }, isAdmin ? [
          btn("Reindex", "refresh", { class: "ghost sm", size: "sm", onclick: (e) => run(e.currentTarget, () => api("/admin/documents/" + d.id + "/reindex?force=true", { method: "POST" }), "Reindexing " + d.title).then(load) }),
          btn("Delete", "trash", { class: "danger sm", size: "sm", onclick: async (e) => { if (await confirmDialog("Delete this document?", `“${d.title}” and its passages are removed from the knowledge base.`, { ok: "Delete", danger: true })) run(e.currentTarget, () => api("/admin/documents/" + d.id, { method: "DELETE" }), "Document deleted").then(load); } })] : null))))))
      : emptyState("book", docs.length ? "No documents match" : "The knowledge base is empty", docs.length ? "Change the filter." : "Upload a document or add a help-center page above."));

/* ---------------- users ---------------- */
async function viewUsers() {
  const name = h("input", { placeholder: "username", "aria-label": "Username", autocomplete: "off" }), pw = h("input", { type: "password", placeholder: "password (10+ characters)", "aria-label": "Password", autocomplete: "new-password" });

        h("td", {}, h("select", { "aria-label": "Role of " + u.username, onchange: (e) => patch({ role: e.target.value }, "Role changed") }, ["agent", "admin"].map((r) => h("option", { value: r, selected: r === u.role }, r)))),

          btn("Reset password", "key", { class: "ghost sm", size: "sm", onclick: async () => { const v = await ask({ title: "Reset password for " + u.username, fields: [{ name: "password", label: "New password (at least 10 characters)", type: "password" }], ok: "Reset" }); if (v) patch({ password: v.password }, "Password reset"); } }),
          btn("Delete", "trash", { class: "danger sm", size: "sm", onclick: async (e) => { if (await confirmDialog("Delete user " + u.username + "?", "They will not be able to sign in any more.", { ok: "Delete", danger: true })) run(e.currentTarget, () => api("/admin/users/" + u.id, { method: "DELETE" }), "User deleted").then(load); } })));
    })))));

if (state.token && !state.user) api("/admin/me").then((m) => { state.user = m.username; sessionStorage.setItem("user", m.username); route(); }).catch(() => {});
